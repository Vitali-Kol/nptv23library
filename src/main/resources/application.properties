spring.application.name=NPTV23LibraryJPA

spring.datasource.url=jdbc:mariadb://localhost:3306/nptv23libraryjpa?useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=nptv23libraryjpa
spring.datasource.password=nptv23libraryjpa
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect